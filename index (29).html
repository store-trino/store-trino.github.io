SOZLASH (bir marta):
1) console.firebase.google.com -> yangi loyiha -> Web ilova (</>) qo'shing, config'ni pastdagi CFG ga qo'ying.
2) Authentication -> Email/Password yoqing, o'zingizning gmail+parol bilan foydalanuvchi yarating.
3) Firestore Database yarating. "admins" kolleksiyasida hujjat ID = gmail (kichik harflarda), maydon: main = true (boolean).
4) Firestore -> Rules ga quyidagini qo'ying:
rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
 function adm(){ return request.auth!=null && exists(/databases/$(d)/documents/admins/$(request.auth.token.email)); }
 function main(){ return adm() && get(/databases/$(d)/documents/admins/$(request.auth.token.email)).data.main==true; }
 function okOrder(r){ return r.keys().hasOnly(['no','name','phone1','phone2','address','lat','lng','geo','pid','pname','price','status','comments','createdAt','qty','opts','total'])
  && r.status=='new' && r.no is string && r.no.size()<=20
  && r.name is string && r.name.size()>=3 && r.name.size()<=100
  && r.phone1 is string && r.phone1.matches('^[+]998[0-9]{9}$') && r.phone2 is string && r.phone2.matches('^[+]998[0-9]{9}$')
  && r.address is string && r.address.size()>=5 && r.address.size()<=300
  && (r.lat==null || r.lat is number) && (r.lng==null || r.lng is number) && (r.geo==null || r.geo is string)
  && r.pid is string && r.pname is string && r.pname.size()<=200
  && r.price is number && r.price==get(/databases/$(d)/documents/products/$(r.pid)).data.price
  && get(/databases/$(d)/documents/products/$(r.pid)).data.get('soldOut',false)==false
  && r.get('qty',1) is int && r.get('qty',1)>=1 && r.get('qty',1)<=20 && r.get('total',r.price)==r.price*r.get('qty',1) && r.get('opts','') is string && r.get('opts','').size()<=300
  && r.comments is list && r.comments.size()==0 && r.createdAt is number; }
 function okRev(r){ return r.keys().hasOnly(['name','text','stars','img','reply','seen','approved','createdAt'])
  && r.name is string && r.name.size()>=1 && r.name.size()<=60
  && r.text is string && r.text.size()>=1 && r.text.size()<=1000
  && r.stars is int && r.stars>=1 && r.stars<=5
  && r.img is string && r.img.size()<700000 && r.reply=='' && r.seen==false && r.approved==false && r.createdAt is number; }
 function okEv(r){ return r.keys().hasOnly(['pid','type','ts']) && r.pid is string && r.pid.size()<=40 && r.type in ['view','interest'] && r.ts is number; }
 function okTrk(r){ return r.keys().hasOnly(['status','pname','createdAt']) && r.status=='new' && r.pname is string && r.pname.size()<=200 && r.createdAt is number; }
 match /products/{i}{ allow read:if true; allow write:if adm(); }
 match /orders/{i}{ allow create:if okOrder(request.resource.data); allow read,update,delete:if adm(); }
 match /tracks/{n}{ allow get:if true; allow list:if adm(); allow create:if okTrk(request.resource.data) || adm(); allow update,delete:if adm(); }
 match /reviews/{i}{ allow read:if adm() || resource.data.approved==true; allow create:if okRev(request.resource.data); allow update,delete:if adm(); }
 match /categories/{i}{ allow read:if true; allow write:if adm(); }
 match /events/{i}{ allow create:if okEv(request.resource.data); allow read:if adm(); }
 match /admins/{e}{ allow read:if request.auth!=null && (request.auth.token.email==e || adm()); allow write:if main(); }
}}

<style>
:root{--p:#c9972b;--pd:#a67612;--n:#111214;--bg:#f6f3ec;--g:#16a34a;--r:#dc2626;--y:#eab308;--t:#1f2024;--m:#6f6b63;--line:#e6e0d2}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;color:var(--t);background:var(--bg)}
h1,h2,h3{font-family:Georgia,serif;margin:.2em 0}
button,input,textarea,select{font:inherit}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid #ddd6c6;border-radius:10px;margin:4px 0 10px;background:#fff}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #f0d28a;border-color:var(--p)}
a{color:inherit}
.btn{background:linear-gradient(135deg,#e6bb55,#b8860b);color:#1a1405;border:0;padding:11px 20px;border-radius:10px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait}
.btn.s{background:var(--n);color:#fff}.btn.l{background:#ece7da;color:var(--n)}.btn.l.on{background:#fde8e8;color:#b91c1c}
.btn.sm{padding:6px 12px;font-size:14px}.btn.red{background:var(--r);color:#fff}.btn.ok{background:var(--g);color:#fff}
.hero{background:#000;border-bottom:6px solid #c9a227;line-height:0}
.hero img{display:block;width:100%;max-height:75vh;object-fit:contain;margin:0 auto}
.wrap{max-width:820px;margin:0 auto;padding:14px 12px 28px}
.sec{font-size:28px}.sec:after{content:"";display:block;width:54px;height:3px;background:var(--p);margin-top:6px;border-radius:2px}
.tool{position:sticky;top:0;z-index:40;background:#f6f3eef2;backdrop-filter:blur(8px);padding:12px 0 8px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.search{position:relative}.search:before{content:"🔍";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:15px}
.search input{padding-left:42px;border-radius:999px;margin:0;border-color:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips:empty{display:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s}
.chip:hover{border-color:var(--p)}.chip.on{background:var(--n);color:#e6bb55;border-color:var(--n)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid.ag{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.empty{grid-column:1/-1;text-align:center;color:var(--m);padding:30px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px #11121414;transition:.2s;display:flex;flex-direction:column}
.card.pu{cursor:pointer}.card.pu:hover{transform:translateY(-4px);box-shadow:0 12px 26px #11121430}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#ece7da}
.ci{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nm{font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tag{font-size:12px;color:var(--m)}.price{color:var(--pd);font-weight:800;font-size:18px}
.ca{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:999}
.box{background:#fff;border-radius:18px;max-width:640px;width:100%;padding:20px;position:relative;margin:auto;animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.x{position:absolute;right:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;background:#dc2626;color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;z-index:5;box-shadow:0 2px 8px #0005;display:flex;align-items:center;justify-content:center}.x:hover{background:#b91c1c}.box h2{padding-right:40px}
.big{width:100%;border-radius:12px;max-height:420px;object-fit:cover}
.th{display:flex;gap:8px;margin:8px 0;overflow:auto}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1;min-width:150px}
.stars span{font-size:30px;color:#cbd0dc;cursor:pointer}.stars span.on{color:var(--y)}
.rev{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;border-left:4px solid var(--p);box-shadow:0 1px 6px #11121410}
.rev img{max-width:160px;border-radius:8px;display:block}.reply{background:#fbf3df;border-radius:8px;padding:8px 10px;margin-top:8px}
footer{background:#000;color:#cfc8b6;text-align:center;padding:34px 16px;border-top:4px solid #c9a227}
footer a{color:#e6bb55;margin:0 10px;font-weight:700;text-decoration:none}footer a:hover{text-decoration:underline}
.flogo{font:700 28px Georgia,serif;letter-spacing:6px;color:#e6bb55}.fl{margin:10px 0}
.err{color:var(--r);font-size:14px;min-height:18px}
.trk{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px #11121414;margin-top:12px}.trk.bad{border-left:5px solid #6b7280}
.steps{display:flex;gap:6px;margin:14px 0 6px}.stp{flex:1;text-align:center;font-size:13px;padding:8px 4px;border-radius:8px;background:#ece7da;color:var(--m);font-weight:700}.stp.on{background:var(--n);color:#e6bb55}
.gs{color:var(--g);font-weight:700;margin-left:6px}.hint{display:block;color:var(--m);margin:8px 0 2px}
.pic{position:relative}.pic.so img{filter:grayscale(1);opacity:.55}
.bd{position:absolute;top:8px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12px}
.bd.sale{left:8px;background:#dc2626;color:#fff}.bd.new2{right:8px;background:#111214;color:#e6bb55}
.sold{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;text-align:center;padding:6px;font-weight:700;font-size:13px}
.old{color:var(--m);font-size:14px}.btn.l:disabled{cursor:not-allowed}
.chart{display:flex;align-items:stretch;gap:3px;height:150px;background:#fff;border-radius:12px;padding:10px;margin:8px 0;box-shadow:0 1px 6px #11121414}
.cb{flex:1;display:flex;flex-direction:column;min-width:0}.bw{flex:1;display:flex;align-items:flex-end}
.cv{width:100%;background:var(--p);border-radius:4px 4px 0 0;min-height:2px}.cb small{font-size:9px;color:var(--m);margin-top:3px;height:12px;text-align:center;white-space:nowrap}
.vg{margin:12px 0 4px}.vg b{display:block;margin-bottom:2px}
.qrow{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:16px}.qrow #qv{min-width:26px;text-align:center;font-weight:800;font-size:18px}
.nav{position:sticky;top:0;z-index:40;background:#f6f3eef5;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nw{max-width:820px;margin:0 auto;padding:8px 12px}
.tabsb{display:flex;gap:6px}.tb{flex:1;border:0;background:#ece7da;border-radius:10px;padding:9px 2px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--t)}.tb.on{background:var(--n);color:#e6bb55}
.sbar{display:flex;gap:8px;margin-top:8px}.sbar .search{flex:1}.search input{height:42px}
.fwrap{position:relative}.fbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t)}.fbtn.act{background:var(--n);color:#e6bb55;border-color:var(--n)}
.fpanel{display:none;position:absolute;right:0;top:48px;background:#fff;border-radius:14px;box-shadow:0 10px 30px #0003;padding:6px;min-width:210px;max-height:60vh;overflow:auto;z-index:60}.fpanel.open{display:block}
.fi{padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:600}.fi:hover{background:#f6f3ec}.fi.on{background:var(--n);color:#e6bb55}
.fchip{display:inline-flex;gap:8px;align-items:center;background:var(--n);color:#e6bb55;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin-top:8px}.fchip b{cursor:pointer;color:#fff}
.nm{font-size:13px;min-height:2.4em}.price{font-size:14px}.ci{padding:6px 8px 8px}.tag{font-size:11px}.old{font-size:12px}
.card .bd{font-size:10px;padding:2px 7px;top:5px}.card .bd.sale{left:5px}.card .bd.new2{right:5px}.sold{font-size:11px;padding:4px}
.card.sl{box-shadow:0 0 0 2px #dc262666,0 2px 12px #11121414}
@keyframes pulse{0%{box-shadow:0 0 0 0 #dc2626aa}70%{box-shadow:0 0 0 8px #dc262600}100%{box-shadow:0 0 0 0 #dc262600}}
.bd.pulse{animation:pulse 1.5s infinite}
.galw{position:relative}.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:min(60vh,420px);object-fit:cover;scroll-snap-align:center;background:#ece7da}
.gn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:22px;line-height:1;cursor:pointer;padding:0}.gp{left:8px}.gx{right:8px}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}.dots i{width:7px;height:7px;border-radius:50%;background:#fff9;transition:.2s}.dots i.on{background:#fff;width:18px;border-radius:4px}

.wrap{max-width:600px}.grid{gap:8px}
.card{border-radius:12px}.card img{aspect-ratio:1/1}
.nm{font-size:12px;min-height:2.4em}.price{font-size:13px}.ci{padding:5px 6px 7px}.tag{font-size:10px}.old{font-size:11px}
.card .bd{font-size:9px;padding:2px 6px}
.grid.ag{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.grid.ag .nm{font-size:13px}.grid.ag .price{font-size:14px}
.ptabs{display:flex;gap:8px;margin:10px 0}.ptabs .btn{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111214;color:#e6bb55;padding:12px 22px;border-radius:999px;z-index:2000;box-shadow:0 8px 24px #0006;animation:up .25s;font-weight:700}

.row{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 6px #11121414}

.badge{display:inline-block;color:#fff;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
.new{background:var(--g)}.talk{background:var(--r)}.done{background:var(--y);color:#222}.rej{background:#6b7280}
.tabs button{margin:0 6px 6px 0}.c{font-size:14px;color:var(--m);border-top:1px dashed #d5d9e4;padding:4px 0}

  const ae=document.activeElement;if(tab=='orders'&&me&&location.hash=='#admin'&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)&&$('#mn')&&$('#mn').contains(ae)))oTab()}
 ordInit=true},()=>{})}

 if(rvInit&&up){toast('Yangi fikr keldi!');if(tab=='reviews'&&me&&location.hash=='#admin')rTab()}rvInit=true},()=>{})}
function adm(){const T=[['orders','Buyurtmalar'],['products','Mahsulotlar'],['stats','Statistika'],['reviews','Fikrlar']];if(me.main)T.push(['admins','Adminlar']);
 $('#app').innerHTML=`<div class="adm"><div class="side"><h3>Boshqaruv</h3>${T.map(t=>`<a class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';adm()">${t[1]}${t[0]=='orders'?`<span class="dot" id="od" style="display:${newOrd?'inline-block':'none'}">${newOrd}</span>`:''}${t[0]=='reviews'?`<span class="dot" id="rb" style="display:${newRev?'inline-block':'none'}">${newRev}</span>`:''}</a>`).join('')}<a onclick="logout()">Chiqish</a></div><div class="main" id="mn">Yuklanmoqda…</div></div>`;
 ({orders:oTab,products:pTab,stats:sTab,reviews:rTab,admins:aTab})[tab]()}

/* Buyurtmalar */

const GEO={gps:"Mijozning joriy joylashuvi (aniq)",pin:"Mijoz xaritada belgilagan",auto:"Manzil matnidan topilgan (taxminiy)"};
const ymap=o=>o.lat!=null?`https://yandex.com/maps/?ll=${o.lng},${o.lat}&pt=${o.lng},${o.lat}&z=17&l=map`:`https://yandex.com/maps/?text=${encodeURIComponent(o.address)}`;
function cp(id){const o=OD.find(x=>x.id==id),t=ymap(o);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Link nusxalandi'),()=>{prompt('Linkni nusxalang:',t)})}
const orow=o=>`<div class="row st-${o.status}"><span class="badge ${SL[o.status][1]}">${SL[o.status][0]}</span> <b>${E(o.no)}</b> · ${fmt(o.createdAt)}<br>
 <b>${E(o.name)}</b> · <a href="tel:${E(o.phone1)}">${E(o.phone1)}</a> · <a href="tel:${E(o.phone2)}">${E(o.phone2)}</a><br>${E(o.pname)}${o.opts?' ('+E(o.opts)+')':''} × ${qt(o)} — ${money(ot(o))}<br>Manzil: ${E(o.address)}
 <div class="loc"><small>${o.geo?GEO[o.geo]:"Xaritada joy topilmadi (Yandex manzil matni bo'yicha qidiradi)"}</small><br><a href="${E(ymap(o))}" target="_blank" rel="noopener">${E(ymap(o))}</a><br><button class="btn sm l" style="margin-top:6px" onclick="cp('${o.id}')">Linkni nusxalash</button></div>
 ${o.status=='rej'?`<div class="rjb"><b>Rad etish sababi:</b> ${E(o.rejReason)}<br><small>${E(o.rejBy)} · ${fmt(o.t_rej)}</small></div>`:''}
 ${(o.comments||[]).map(c=>`<div class="c"><b>${E(c.by)}</b> (${fmt(c.ts)}): ${E(c.text)}</div>`).join('')}
 <input id="c${o.id}" placeholder="Izoh yozing…"><button class="btn sm s" onclick="cm('${o.id}')">Izoh qo'shish</button>
 ${o.status=='new'?`<button class="btn sm red" onclick="st('${o.id}','talk')">Gaplashildi</button>`:''}
 ${o.status=='talk'?`<button class="btn sm ok" onclick="if(confirm('Mahsulot yetkazildi va pul qabul qilindimi?'))st('${o.id}','done')">Yetkazildi, pul olindi</button>`:''}
 ${o.status=='new'||o.status=='talk'?`<button class="btn sm l" onclick="rejForm('${o.id}')">Rad etish</button>`:''}</div>`;
async function oTab(){const O=await list('orders','createdAt');OD=O;
 $('#mn').innerHTML=`<h2>Buyurtmalar</h2><div id="amap"></div><div class="tabs">${Object.keys(SL).map(k=>`<button class="btn sm ${ofil==k?'':'l'}" onclick="ofil='${k}';oTab()">${SL[k][0]} (${O.filter(o=>o.status==k).length})</button>`).join('')}</div>
 <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="search" style="flex:1;min-width:200px"><input id="oq" placeholder="Qidirish: raqam, ism, telefon, manzil…" oninput="oq=this.value;drawO()" value="${E(oq)}"></div><button class="btn sm s" onclick="exportO()">Excelga yuklab olish</button></div><div id="ol"></div>`;drawO();
 amap=L.map('amap').setView([41.311,69.28],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(amap);
 const pts=O.filter(o=>o.lat!=null&&o.status!='rej');pts.forEach(o=>L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div style="width:20px;height:20px;border-radius:50%;background:${COL[o.status]};border:3px ${o.geo=='auto'?'dashed':'solid'} #fff;box-shadow:0 0 4px #000"></div>`})}).addTo(amap).bindPopup(`${E(o.no)}<br>${E(o.name)}<br>${E(o.phone1)}<br><a href="${E(ymap(o))}" target="_blank" rel="noopener">Yandex xaritada ochish</a>`));
 if(pts.length)amap.fitBounds(pts.map(o=>[o.lat,o.lng]),{maxZoom:13,padding:[30,30]})}
function drawO(){const s=oq.trim().toLowerCase(),dg=s.replace(/\D/g,'');
 const m=o=>[o.no,o.name,o.address,o.pname,o.opts].some(x=>String(x||'').toLowerCase().includes(s))||(dg.length>=3&&((o.phone1||'')+(o.phone2||'')).replace(/\D/g,'').includes(dg));
 const a=s?OD.filter(m):OD.filter(o=>o.status==ofil);
 $('#ol').innerHTML=(s?`<p style="color:var(--m)">Qidiruv natijasi: ${a.length} ta (barcha bo'limlardan)</p>`:'')+(a.map(orow).join('')||'<p>Bu bo\'limda buyurtma yo\'q.</p>')}
const loadScript=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function exportO(){
 const rows=[['Raqam','Sana','Holat','Ism','Telefon 1','Telefon 2','Mahsulot','Variant','Miqdor','Narx (1 dona)','Jami','Manzil','Joylashuv','Yandex xarita','Izohlar','Rad etish sababi']].concat(OD.map(o=>[o.no,fmt(o.createdAt),SL[o.status]?SL[o.status][0]:o.status,o.name,o.phone1,o.phone2,o.pname,o.opts||'',qt(o),Number(o.price)||0,ot(o),o.address,o.geo?GEO[o.geo]:'',ymap(o),(o.comments||[]).map(c=>c.by+': '+c.text).join(' | '),o.rejReason||'']));
 const nm='buyurtmalar-'+new Date().toISOString().slice(0,10);
 try{if(!window.XLSX)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[12,16,18,20,16,16,24,22,8,14,14,40,28,40,40,30].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Buyurtmalar');XLSX.writeFile(wb,nm+'.xlsx');toast('Fayl yuklandi')}
 catch(e){const q=c=>{c=String(c??'');return /^[=+\-@]/.test(c)?"'"+c:c},csv='\ufeff'+rows.map(r=>r.map(c=>'"'+q(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=nm+'.csv';a.click();toast('CSV fayl yuklandi')}}
const st=async(id,s)=>{const o=OD.find(x=>x.id==id),b=db.batch();b.update(db.collection('orders').doc(id),{status:s,['t_'+s]:Date.now()});b.set(db.collection('tracks').doc(o.no),{status:s},{merge:true});await b.commit();oTab()};
const cm=async id=>{const v=$('#c'+id).value.trim();if(!v)return;await db.collection('orders').doc(id).update({comments:FV.arrayUnion({by:me.email,text:v,ts:Date.now()})});oTab()};
function rejForm(id){const o=OD.find(x=>x.id==id);modal(`<h2>Buyurtmani rad etish</h2><p><b>${E(o.no)}</b> · ${E(o.name)}</p><label>Rad etish sababi (majburiy)</label><textarea id="rr" rows="3" placeholder="Masalan: mijoz telefonni ko'tarmadi / manzil noto'g'ri / yetkazib bo'lmaydi"></textarea><div class="err" id="rre"></div><button class="btn red" onclick="doRej('${id}')">Rad etish</button>`)}
async function doRej(id){const v=$('#rr').value.trim();if(v.length<3)return $('#rre').textContent="Sababni yozing (kamida 3 belgi).";
 const o=OD.find(x=>x.id==id),b=db.batch();b.update(db.collection('orders').doc(id),{status:'rej',rejReason:v,rejBy:me.email,t_rej:Date.now()});b.set(db.collection('tracks').doc(o.no),{status:'rej'},{merge:true});await b.commit();closeM();oTab()}

/* Mahsulotlar */
async function pTab(){const[A]=await Promise.all([list('products','createdAt'),loadC()]);window.AP=A;
 $('#mn').innerHTML=`<h2>Mahsulotlar</h2><div class="tabs"><button class="btn" onclick="pForm()">+ Yangi mahsulot</button><button class="btn s" onclick="catForm()">Kategoriyalar</button></div>
 <div class="ptabs"><button class="btn sm ${pArch?'l':''}" onclick="pArch=false;pTab()">Asosiy (${AP.filter(p=>!p.archived).length})</button><button class="btn sm ${pArch?'':'l'}" onclick="pArch=true;pTab()">Arxiv (${AP.filter(p=>p.archived).length})</button></div>
 <div class="row"><div class="search"><input id="aq" placeholder="Mahsulot qidirish…" oninput="aq=this.value;drawAP()" value="${E(aq)}"></div><div class="chips" id="acats">${chips(acat,'setACat')}</div></div><div class="grid ag" id="apl"></div>`;drawAP()}
function drawAP(){const a=flt(AP.filter(p=>!!p.archived==pArch),aq,acat);$('#apl').innerHTML=a.length?a.map(p=>card(p,true)).join(''):`<p class="empty">${pArch?'Arxiv bo\'sh.':'Hech narsa topilmadi.'}</p>`}
function setACat(id){acat=id;$('#acats').innerHTML=chips(acat,'setACat');drawAP()}
function catForm(){modal(`<h2>Kategoriyalar</h2><div style="display:flex;gap:8px"><input id="cn" placeholder="Yangi kategoriya nomi"><button class="btn" style="height:44px;margin-top:4px" onclick="addC()">Qo'shish</button></div>
 ${CATS.map(c=>`<div class="row">${E(c.name)} <button class="btn sm red" style="float:right" onclick="delC('${c.id}')">O'chirish</button></div>`).join('')||'<p>Hali kategoriya yo\'q.</p>'}`)}
async function addC(){const n=$('#cn').value.trim();if(!n)return;if(CATS.some(c=>c.name.toLowerCase()==n.toLowerCase()))return toast("Bu kategoriya bor");
 await db.collection('categories').add({name:n,createdAt:Date.now()});await loadC();catForm();pTab()}
async function delC(id){if(!confirm("Kategoriya o'chirilsinmi? Mahsulotlar kategoriyasiz qoladi."))return;await db.collection('categories').doc(id).delete();if(acat==id)acat='';await loadC();catForm();pTab()}
const parseV=t=>t.split('\n').map(l=>{const i=l.indexOf(':');if(i<1)return null;const n=l.slice(0,i).trim(),v=[...new Set(l.slice(i+1).split(',').map(x=>x.trim()).filter(Boolean))];return n&&v.length?{n:n.slice(0,30),v:v.slice(0,20).map(x=>x.slice(0,30))}:null}).filter(Boolean).slice(0,4);
function pForm(id){ed=id?AP.find(p=>p.id==id):{name:'',price:'',oldPrice:'',badge:'',soldOut:false,variants:[],desc:'',specs:'',images:[],cat:''};edImgs=[...(ed.images||[])];
 modal(`<h2>${id?'Tahrirlash':'Yangi mahsulot'}</h2><input id="pn" placeholder="Nomi" value="${E(ed.name)}"><input id="pp" type="number" placeholder="Narxi (so'm)" value="${ed.price}">
 <input id="pop" type="number" placeholder="Eski narx (chegirma uchun, ixtiyoriy)" value="${ed.oldPrice||''}">
 <label>Belgi</label><select id="pbd"><option value="">Belgisiz</option><option value="new" ${ed.badge=='new'?'selected':''}>Yangi</option><option value="sale" ${ed.badge=='sale'?'selected':''}>Aksiya (qizil effekt)</option></select>
 <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="pso" style="width:auto;margin:0" ${ed.soldOut?'checked':''}> Sotuvda yo'q</label>
 <label>Kategoriya</label><select id="pc"><option value="">Kategoriyasiz</option>${CATS.map(c=>`<option value="${c.id}" ${ed.cat==c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select>
 <textarea id="pd" rows="3" placeholder="Tavsif">${E(ed.desc)}</textarea><textarea id="ps" rows="4" placeholder="Xususiyatlari (har biri yangi qatorda)">${E(ed.specs)}</textarea>
 <label>Variantlar (ixtiyoriy)</label><textarea id="pv" rows="3" placeholder="Har biri yangi qatorda. Namuna:&#10;Rang: Qora, Oltin, Kumush&#10;O'lcham: 40, 42, 44">${E((ed.variants||[]).map(g=>g.n+': '+g.v.join(', ')).join('\n'))}</textarea>
 <input type="file" id="pf" accept="image/*" multiple onchange="addI(this)"><div class="imgs" id="pi"></div><button class="btn" onclick="saveP('${id||''}')">Saqlash</button>`);showI()}
const showI=()=>$('#pi').innerHTML=edImgs.map((s,i)=>`<img src="${thumb(s,150)}" title="O'chirish" onclick="edImgs.splice(${i},1);showI()">`).join('');
async function addI(el){const fs=[...el.files];toast('Rasm yuklanmoqda…');for(const f of fs){try{edImgs.push(await upImg(f))}catch(e){toast("Rasm serverga yuklanmadi, oddiy usulda saqlandi");edImgs.push(await shrink(f))}}el.value='';showI()}
async function saveP(id){const d={name:$('#pn').value.trim(),price:+$('#pp').value,oldPrice:+$('#pop').value||0,badge:$('#pbd').value,soldOut:$('#pso').checked,cat:$('#pc').value,desc:$('#pd').value,specs:$('#ps').value,variants:parseV($('#pv').value),images:edImgs};
 const nl=$('#pv').value.split('\n').filter(x=>x.trim()).length;if(nl!=d.variants.length)return alert("Variant qatori noto'g'ri. Namuna: Rang: Qora, Oltin");if(!d.name||!d.price)return alert('Nomi va narxini kiriting');
 if(d.oldPrice&&d.oldPrice<=d.price)return alert("Eski narx yangi narxdan katta bo'lishi kerak");
 id?await db.collection('products').doc(id).update(d):await db.collection('products').add({...d,archived:false,createdAt:Date.now()});closeM();pTab()}
const arch=async(id,v)=>{await db.collection('products').doc(id).update({archived:v});pTab()};

/* Statistika */
let per='week';
async function sTab(){const[A,V,O]=await Promise.all([list('products'),list('events'),list('orders')]);
 const now=new Date(),sod=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),D=864e5;
 const SS={qish:[12,1,2],bahor:[3,4,5],yoz:[6,7,8],kuz:[9,10,11]},MN=['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
 const ok=t=>per=='day'?t>=sod:per=='week'?t>=sod-6*D:per=='month'?t>=sod-29*D:SS[per].includes(new Date(t).getMonth()+1);
 const tm=o=>o.t_done||o.createdAt,sum=(a,o)=>a+ot(o);
 const dn=O.filter(o=>o.status=='done'&&ok(tm(o)));
 const rows=A.map(p=>{const d=dn.filter(o=>o.pid==p.id);return{n:p.name,
  v:V.filter(e=>e.pid==p.id&&e.type!='interest'&&ok(e.ts)).length,
  i:V.filter(e=>e.pid==p.id&&e.type=='interest'&&ok(e.ts)).length,
  s:d.reduce((a,o)=>a+qt(o),0),m:d.reduce(sum,0),
  j:O.filter(o=>o.pid==p.id&&o.status=='rej'&&ok(o.t_rej||o.createdAt)).length}}).sort((a,b)=>b.i-a.i||b.s-a.s);
 const mi=Math.max(1,...rows.map(r=>r.i)),ms=Math.max(1,...rows.map(r=>r.s)),sm=k=>rows.reduce((a,r)=>a+r[k],0);
 const rev=dn.reduce(sum,0),cnt=dn.length,top=rows.slice().sort((a,b)=>b.s-a.s||b.m-a.m)[0];
 let bk=[];
 if(per=='week'||per=='month'){const n=per=='week'?7:30;for(let i=0;i<n;i++){const t0=sod-(n-1-i)*D,d=new Date(t0);
  bk.push([dn.filter(o=>tm(o)>=t0&&tm(o)<t0+D).reduce(sum,0),(n==7||i%5==0)?String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0'):''])}}
 else if(SS[per])bk=SS[per].map(m=>[dn.filter(o=>new Date(tm(o)).getMonth()+1==m).reduce(sum,0),MN[m-1]]);
 const mx=Math.max(1,...bk.map(x=>x[0]));
 const ch=bk.length?`<h3 style="margin-top:14px">Sotuv summasi</h3><div class="chart">${bk.map(x=>`<div class="cb"><div class="bw"><div class="cv" style="height:${x[0]/mx*100}%" title="${E(money(x[0]))}"></div></div><small>${x[1]}</small></div>`).join('')}</div>`:'';
 $('#mn').innerHTML=`<h2>Statistika</h2><div class="tabs">${[['day','Bugun'],['week','Hafta'],['month','Oy'],['qish','Qish'],['bahor','Bahor'],['yoz','Yoz'],['kuz','Kuz']].map(x=>`<button class="btn sm ${per==x[0]?'':'l'}" onclick="per='${x[0]}';sTab()">${x[1]}</button>`).join('')}</div>
 <div class="sum"><div><small>Daromad (yetkazilgan)</small><b style="font-size:20px">${money(rev)}</b></div><div><small>Sotilgan (dona)</small><b>${sm('s')}</b></div><div><small>O'rtacha buyurtma</small><b style="font-size:20px">${money(cnt?rev/cnt:0)}</b></div>
 <div><small>Qiziqish bildirildi</small><b>${sm('i')}</b></div><div><small>Rad etilgan</small><b>${sm('j')}</b></div><div><small>Eng ko'p sotilgan</small><b style="font-size:16px">${top&&top.s?E(top.n):'—'}</b></div></div>
 ${ch}
 ${rows.map(r=>`<div class="row"><b>${E(r.n)}</b><br>♥ Qiziqish: ${r.i}<div class="bar" style="width:${r.i/mi*100}%"></div>Sotilgan: ${r.s} · Daromad: ${money(r.m)}<div class="bar b" style="width:${r.s/ms*100}%"></div><small style="color:var(--m)">Rad etilgan: ${r.j} · Ko'rilgan: ${r.v}</small></div>`).join('')||'Ma\'lumot yo\'q'}`}

/* Fikrlar */
async function rTab(){const A=await list('reviews','createdAt');
 const old=A.filter(r=>r.approved===undefined);if(old.length){const b=db.batch();old.forEach(r=>{b.update(db.collection('reviews').doc(r.id),{approved:true});r.approved=true});await b.commit().catch(()=>{})}
 const row=r=>`<div class="row ${r.seen?'':'fresh'}"><b>${E(r.name)}</b> ${r.seen?'':'<span class="badge new">YANGI</span>'} <span style="color:var(--y)">${'★'.repeat(r.stars)}</span> · ${fmt(r.createdAt)}<br>${E(r.text)}${r.img?`<br><img src="${r.img}" style="max-width:140px;border-radius:8px">`:''}
 ${r.approved?`${r.reply?`<div class="reply">${E(r.reply)}</div>`:''}<input id="r${r.id}" placeholder="Javob yozing…" value="${E(r.reply||'')}"><button class="btn sm s" onclick="rep('${r.id}')">Javobni saqlash</button> <button class="btn sm l" onclick="apRv('${r.id}',false)">Yashirish</button>`
 :`<div style="margin-top:8px"><button class="btn sm ok" onclick="apRv('${r.id}',true)">Tasdiqlash</button> </div>`} <button class="btn sm red" onclick="delRv('${r.id}')">O'chirish</button></div>`;
 const pend=A.filter(r=>!r.approved),ok=A.filter(r=>r.approved);
 $('#mn').innerHTML=`<h2>Fikrlar</h2><h3>Tekshiruvda (${pend.length})</h3>${pend.map(row).join('')||'<p style="color:var(--m)">Yangi fikr yo\'q.</p>'}<h3 style="margin-top:20px">Saytda ko'rinayotganlar (${ok.length})</h3>${ok.map(row).join('')||'<p style="color:var(--m)">Hali yo\'q.</p>'}`;
 const un=A.filter(r=>!r.seen);if(un.length){const b=db.batch();un.forEach(r=>b.update(db.collection('reviews').doc(r.id),{seen:true}));b.commit().catch(()=>{})}}
const apRv=async(id,v)=>{await db.collection('reviews').doc(id).update({approved:v});rTab()};
const delRv=async id=>{if(confirm("Fikr o'chirilsinmi?")){await db.collection('reviews').doc(id).delete();rTab()}};
const rep=async id=>{await db.collection('reviews').doc(id).update({reply:$('#r'+id).value.trim()});rTab()};

/* Adminlar */

 $('#mn').innerHTML=`<h2>Adminlar</h2><div class="row"><input id="ae" type="email" placeholder="Hamkor gmaili"><button class="btn" onclick="addA()">Admin qo'shish</button><p style="color:var(--m);font-size:14px">Hamkor kirish sahifasida shu gmail bilan "Ro'yxatdan o'tish"ni bosib parol yaratadi.</p></div>

route();
